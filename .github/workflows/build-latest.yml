name: Build Latest HLAE Package

# Builds a full HLAE release package (hlae.zip) from the current revision of
# this fork, so unreleased commits on main can be tested without waiting for
# an official build. WiX installer creation is skipped, the plain package ZIP
# that the official release ships is produced instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, e.g. 2.192.7.1 (tag becomes v<version>, asset hlae_<a_b_c_d>.zip)"
        required: true
        default: "2.192.7.1"
      create_release:
        description: "Also publish a GitHub Release with the built ZIP"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Report revision
        shell: bash
        run: |
          echo "Building revision: $(git rev-parse HEAD)"
          git log -1 --format='Subject: %s'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4

      - name: Install gettext
        run: scoop install gettext

      - name: Ensure Rust targets
        shell: bash
        run: |
          rustup target list --installed
          rustup target add \
            --toolchain stable-x86_64-pc-windows-msvc \
            i686-pc-windows-msvc

      - name: Configure and build package
        run: cmake -DAFX_MULTIBUILD_INSTALLER=OFF -P cmake/MultiBuild.cmake

      - name: Verify package output
        shell: bash
        run: |
          ls -lh build/package-release/hlae.zip
          ls -lh build/package-release/hlae_pdb.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hlae-package-${{ github.sha }}
          path: |
            build/package-release/hlae.zip
            build/package-release/hlae_pdb.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ inputs.create_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          STEM="hlae_$(printf '%s' "${VERSION}" | tr '.' '_')"
          cp build/package-release/hlae.zip "build/package-release/${STEM}.zip"
          cp build/package-release/hlae_pdb.zip "build/package-release/${STEM}_pdb.zip"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "build/package-release/${STEM}.zip" \
            "build/package-release/${STEM}_pdb.zip" \
            --title "HLAE ${VERSION}" \
            --notes "Unofficial build from commit ${GITHUB_SHA}.

          Built from the current revision of this fork, using
          AFX_MULTIBUILD_INSTALLER=OFF so the WiX installer is skipped and only
          the plain package ZIP is produced.

          - ${STEM}.zip - same layout as the official release package.
          - ${STEM}_pdb.zip - debug symbols."
